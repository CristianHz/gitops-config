apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-skeleton
  labels:
    app: react-skeleton
spec:
  ingressClassName: nginx
  rules:
    - host: react-template.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-skeleton
                port:
                  number: 80
