apiVersion: platform/v1
kind: FoundryRequestPolicy
spec:
  allowedTemplateRepo: CristianHz/app-stacks
  allowedTemplatePath: templates/azure/foundry-basic
  allowedTeams:
    - team-research
  allowedEnvironments:
    - dev
    - staging
  allowedLocations:
    - eastus2
  allowedDataClassifications:
